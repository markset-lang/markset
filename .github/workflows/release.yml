name: Release
on:
  push:
    # A digit after the v, so the extension's tags (vscode-v0.3.2) do not start a
    # run that the version check then refuses. Only a package release is a v-tag.
    tags: ["v[0-9]*"]
  workflow_dispatch:

# id-token lets npm attach provenance, which ties each published tarball to the
# commit and workflow run that produced it.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The test suite builds the site, which draws mermaid, which needs the
      # browser mermaid-cli brings. Cached so a release is not a cold download.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci

      # A tag can be pushed from anywhere, so the release re-proves the whole
      # thing rather than trusting that CI ran on this commit.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run conformance

      # Only on a tag: on a manual run GITHUB_REF_NAME is the branch, which can
      # never equal a version, so without this the workflow_dispatch trigger it
      # advertises could not finish. A manual run publishes whatever version the
      # checked-out commit declares, which is the point of having the trigger.
      - name: The tag must match the version being published
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      # Publishing has to be safe to repeat. npm answers a second publish of a
      # version that already exists with a 403, which would fail the whole run
      # and leave any package after it unpublished -- so a re-pushed tag, or a
      # run after a partial publish, would be worse than useless. Skip what is
      # already on the registry and publish the rest.
      #
      # The list comes out of the release script rather than being written
      # again here, so the two cannot disagree about what ships. Every package
      # declares access: public, so no flag is needed for the scope.
      # Nothing configures a credential, deliberately. These packages use npm's
      # trusted publishing, so npm exchanges the OIDC token GitHub mints for
      # this run -- which is why the job asks for id-token: write -- for a
      # short-lived registry token scoped to this workflow. An .npmrc carrying
      # an empty _authToken would be worse than none at all: npm would try that
      # credential, be refused, and never reach the OIDC path. That is exactly
      # how npm ci failed here before, so it is not a hypothetical.
      - name: Publish what is not already on the registry
        run: |
          npm run build
          version="$(node -p "require('./package.json').version")"
          names="$(node -p "require('./package.json').scripts.release.match(/@markset-lang\/[a-z-]+/g).join(' ')")"
          for name in $names; do
            # Asked over plain HTTPS rather than through the npm client, so the
            # check cannot fail for a credential reason. A failure here would
            # read as "not published" and turn a safe skip into a publish that
            # 403s -- the one outcome this step exists to prevent.
            if curl -sf -o /dev/null "https://registry.npmjs.org/${name//\//%2f}/$version"; then
              echo "$name@$version is already published"
            else
              npm publish --workspace "$name" --provenance
            fi
          done
