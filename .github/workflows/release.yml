name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# id-token lets npm attach provenance, which ties each published tarball to the
# commit and workflow run that produced it.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The test suite builds the site, which draws mermaid, which needs the
      # browser mermaid-cli brings. Cached so a release is not a cold download.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci

      # A tag can be pushed from anywhere, so the release re-proves the whole
      # thing rather than trusting that CI ran on this commit.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run conformance

      - name: The tag must match the version being published
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      # Publishing has to be safe to repeat. npm answers a second publish of a
      # version that already exists with a 403, which would fail the whole run
      # and leave any package after it unpublished -- so a re-pushed tag, or a
      # run after a partial publish, would be worse than useless. Skip what is
      # already on the registry and publish the rest.
      #
      # The list comes out of the release script rather than being written
      # again here, so the two cannot disagree about what ships. Every package
      # declares access: public, so no flag is needed for the scope.
      # The registry is configured here rather than at the top of the job.
      # setup-node's registry-url writes an .npmrc with always-auth, so every
      # npm command sends NODE_AUTH_TOKEN -- including npm ci, which then fails
      # with a 401 when the secret is absent, before anything has been proved.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish what is not already on the registry
        run: |
          npm run build
          version="$(node -p "require('./package.json').version")"
          names="$(node -p "require('./package.json').scripts.release.match(/@markset-lang\/[a-z-]+/g).join(' ')")"
          for name in $names; do
            # Asked over plain HTTPS rather than through the npm client, which
            # reads the .npmrc setup-node wrote and fails on a missing or bad
            # token. That failure would read as "not published", turning a safe
            # skip into a publish that 403s.
            if curl -sf -o /dev/null "https://registry.npmjs.org/${name//\//%2f}/$version"; then
              echo "$name@$version is already published"
            else
              npm publish --workspace "$name" --provenance
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
