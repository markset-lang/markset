name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run conformance
      # typescript is deliberately not a project dependency; --no-save fetches it for this check only.
      - run: npm install --no-save typescript @types/node
      - run: npx tsc --noEmit -p tsconfig.json
